<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <title>Spheres Practice</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="floating-number.js"></script>
    <script src="score-manager.js"></script>
    <script src="data-manager.js"></script>
    <script src="sphere-manager.js"></script>
</head>
<body>
    <a-scene background="color: #0b0e14" vr-mode-ui="enabled: false" loading-screen="enabled: false" cursor="rayOrigin: mouse" raycaster="objects: .target">
        <a-entity light="type: ambient; intensity: 0.9"></a-entity>
        <a-entity light="type: directional; intensity: 1.5" position="1 3 2"></a-entity>
        <a-entity id="score-display" score-manager position="0 1.32 -0.6" text="value: Score: 0; align: center; width: 1.2; color: #ffffff"></a-entity>
        <a-entity id="data-manager" data-manager></a-entity>
        <a-entity id="sphere-manager" sphere-manager></a-entity>
        <a-entity camera position="0 1.25 0.35" rotation="-12 0 0"></a-entity>
    </a-scene>
</body>
</html>
